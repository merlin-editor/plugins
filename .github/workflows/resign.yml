name: Re-sign

# Each week, a new serial and expiry, so the index never expires while
# nothing changes. An index lasts 30 days.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  resign:
    runs-on: ubuntu-24.04
    environment: registry
    container:
      image: rust:1.97.1-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c
    steps:
      - name: Install tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates python3 minisign gh
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Sign
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          git config --global --add safe.directory '*'
          build/sign.sh
